name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: employee_app
      DB_PASSWORD: employee_password
      DB_NAME: employee_manager_test
      DB_CONNECTION_LIMIT: 5
      RUN_INTEGRATION_TESTS: 'true'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: employee_manager_test
          MYSQL_USER: employee_app
          MYSQL_PASSWORD: employee_password
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uemployee_app --password=employee_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Test with coverage
        run: pnpm coverage

      - name: Run operator smoke check
        run: pnpm smoke

      - name: Build distribution
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
